<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pixel Zombie Sniper</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
canvas{display:block;background:linear-gradient(#222,#111)}

#ui{position:absolute;top:10px;left:10px;color:#fff;font-size:14px;z-index:2}
#rightControls{position:absolute;right:20px;bottom:190px;display:flex;flex-direction:column;gap:10px;z-index:2}
#fireBtn{position:absolute;right:20px;bottom:60px;width:90px;height:90px;border-radius:50%;background:#9b0000;color:#fff;font-size:18px;border:none;z-index:2}
#joystick{position:absolute;left:60px;bottom:60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);touch-action:none;z-index:2}
#stick{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4);position:absolute;left:35px;top:35px}

#shop{position:absolute;inset:0;background:rgba(0,0,0,.9);color:#fff;display:none;flex-direction:column;padding:20px;z-index:5;overflow:auto}
.shopItem{border:1px solid #555;padding:12px;margin:8px 0;border-radius:8px}
.shopItem button{width:100%;margin-top:6px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<audio autoplay loop>
 <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_163.mp3">
</audio>

<div id="ui">
🧟 Ronda: <span id="round">1</span><br>
❤️ Fuerte: <span id="base">100</span><br>
💰 Dinero: $<span id="money">0</span><br>
🔫 Sniper: <span id="sniperName">Básico</span><br>
🔫 Balas: <span id="ammo">6</span>
</div>

<div id="rightControls">
 <button onclick="toggleZoom()">🔭 ZOOM</button>
 <button onclick="reload()">🔄 RECARGAR</button>
 <button onclick="openShop()">🛒 TIENDA</button>
</div>

<button id="fireBtn" ontouchstart="shoot()">🔫</button>
<div id="joystick"><div id="stick"></div></div>

<div id="shop">
 <h2>🛒 TIENDA</h2>
 <div id="shopList"></div>
 <button onclick="closeShop()">CERRAR</button>
</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

let base=100,round=1,toSpawn=10,spawnTimer=0;
let zombies=[],damageTexts=[];
let money=0,paused=false;

const snipers=[
 {name:"Básico",damage:1,ammo:6,zoom:1,price:0,owned:true,aoe:0},
 {name:"Scout",damage:2,ammo:8,zoom:1.2,price:150,owned:false,aoe:0},
 {name:"Tactical",damage:3,ammo:6,zoom:1.5,price:300,owned:false,aoe:0},
 {name:"Heavy",damage:5,ammo:4,zoom:2,price:500,owned:false,aoe:0},
 {name:"Explosivo",damage:4,ammo:4,zoom:1.8,price:700,owned:false,aoe:80}
];

let currentSniper=0;
let ammo=snipers[0].ammo;
let cross={x:c.width/2,y:c.height/2};
let zoom=false;

/* ===== SHOP ===== */
function openShop(){paused=true;shop.style.display="flex";renderShop();}
function closeShop(){paused=false;shop.style.display="none";}
function renderShop(){
 shopList.innerHTML="";
 snipers.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="shopItem";
  d.innerHTML=`<b>${s.name}</b><br>Daño:${s.damage} | Balas:${s.ammo}<br>Precio:$${s.price}`;
  const b=document.createElement("button");
  b.textContent=s.owned?"EQUIPAR":"COMPRAR";
  b.onclick=()=>{
   if(!s.owned){
    if(money<s.price)return alert("Sin dinero");
    money-=s.price;s.owned=true;
   }
   currentSniper=i;ammo=s.ammo;closeShop();
  };
  d.appendChild(b);
  shopList.appendChild(d);
 });
}

/* ===== ZOMBIES ===== */
function spawnZombie(){
 let r=Math.random();
 let z={x:Math.random()*c.width,y:-20};
 if(r<0.6){z.hp=3+round;z.speed=0.6;z.color="green";}
 else if(r<0.85){z.hp=6+round;z.speed=0.3;z.color="purple";}
 else{z.hp=2+round;z.speed=1.2;z.color="orange";}
 zombies.push(z);
}

/* ===== DAMAGE TEXT ===== */
function showDamage(x,y,val){
 damageTexts.push({x,y,val,life:60});
}

/* ===== SHOOT ===== */
function shoot(){
 if(paused||ammo<=0)return;
 ammo--;
 let s=snipers[currentSniper];

 zombies.forEach((z,i)=>{
  if(Math.abs(z.x-cross.x)<20 && Math.abs(z.y-cross.y)<20){
   z.hp-=s.damage;
   showDamage(z.x,z.y,s.damage);

   if(s.aoe){
    zombies.forEach(o=>{
     let d=Math.hypot(o.x-z.x,o.y-z.y);
     if(d<s.aoe){
      o.hp-=1;
      showDamage(o.x,o.y,1);
     }
    });
   }

   if(z.hp<=0){
    money+=10;
    zombies.splice(i,1);
   }
  }
 });
}

function reload(){if(!paused)setTimeout(()=>ammo=snipers[currentSniper].ammo,700);}
function toggleZoom(){if(!paused)zoom=!zoom;}

/* ===== JOYSTICK (FIXED) ===== */
let jx=0,jy=0,joystickActive=false;

joystick.addEventListener("touchstart",e=>{
 joystickActive=true;
 e.preventDefault();
});
joystick.addEventListener("touchend",e=>{
 joystickActive=false;
 jx=jy=0;
 stick.style.left="35px";
 stick.style.top="35px";
 e.preventDefault();
});
joystick.addEventListener("touchmove",e=>{
 if(!joystickActive)return;
 e.preventDefault();
 const rect=joystick.getBoundingClientRect();
 const t=e.touches[0];
 let dx=t.clientX-(rect.left+rect.width/2);
 let dy=t.clientY-(rect.top+rect.height/2);
 const max=rect.width/2;
 const dist=Math.hypot(dx,dy);
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max;}
 jx=dx/max;jy=dy/max;
 stick.style.left=(dx+max-25)+"px";
 stick.style.top=(dy+max-25)+"px";
});

/* ===== LOOP ===== */
function loop(){
 if(paused){requestAnimationFrame(loop);return;}
 ctx.clearRect(0,0,c.width,c.height);

 cross.x+=jx*6;
 cross.y+=jy*6;
 cross.x=Math.max(20,Math.min(c.width-20,cross.x));
 cross.y=Math.max(20,Math.min(c.height-80,cross.y));

 if(toSpawn>0){
  spawnTimer++;
  if(spawnTimer>40){
   spawnZombie();
   toSpawn--;
   spawnTimer=0;
  }
 }

 zombies.forEach((z,i)=>{
  z.y+=z.speed;
  ctx.fillStyle=z.color;
  ctx.fillRect(z.x-12,z.y-12,24,24);
  if(z.y>c.height-70){
   base--;
   zombies.splice(i,1);
  }
 });

 damageTexts.forEach((d,i)=>{
  d.y-=0.5;
  d.life--;
  ctx.fillStyle="yellow";
  ctx.font="16px Arial";
  ctx.fillText("-"+d.val,d.x,d.y);
  if(d.life<=0)damageTexts.splice(i,1);
 });

 ctx.strokeStyle="red";
 ctx.beginPath();
 ctx.moveTo(cross.x-15,cross.y);
 ctx.lineTo(cross.x+15,cross.y);
 ctx.moveTo(cross.x,cross.y-15);
 ctx.lineTo(cross.x,cross.y+15);
 ctx.stroke();

 if(zombies.length===0 && toSpawn===0){
  round++;
  toSpawn=10+round*2;
 }

 roundSpan.textContent=round;
 baseSpan.textContent=base;
 moneySpan.textContent=money;
 ammoSpan.textContent=ammo;
 sniperName.textContent=snipers[currentSniper].name;

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
