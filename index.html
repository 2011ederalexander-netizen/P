<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pixel Zombie Sniper — Historia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
canvas{display:block;background:linear-gradient(#3a3a3a,#111)}

#ui{
 position:absolute;top:10px;left:10px;
 color:#fff;font-size:14px
}

#controls{
 position:absolute;left:10px;bottom:10px;
 display:flex;flex-direction:column;gap:6px
}

#shop{
 position:absolute;right:10px;bottom:10px;
 background:rgba(0,0,0,.8);
 padding:8px;color:white;font-size:13px;
 border-radius:8px;border:1px solid #555
}

button{padding:8px;border-radius:6px;font-size:14px}

#overlay{
 position:absolute;inset:0;
 background:rgba(0,0,0,.9);
 color:white;display:flex;
 align-items:center;justify-content:center;
 flex-direction:column;
 text-align:center;padding:20px;
 font-size:18px
}

#joystick{
 position:absolute;left:80px;bottom:80px;
 width:120px;height:120px;border-radius:50%;
 background:rgba(255,255,255,.08);
 touch-action:none
}
#stick{
 width:50px;height:50px;border-radius:50%;
 background:rgba(255,255,255,.4);
 position:absolute;left:35px;top:35px
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
📖 Misión: <span id="missionTxt"></span><br>
🧟 Eliminados: <span id="kills">0</span>/<span id="goal"></span><br>
❤️ Fuerte: <span id="base"></span><br>
🔫 Balas: <span id="ammo"></span>
</div>

<div id="controls">
 <button onclick="reload()">🔄 RECARGAR</button>
</div>

<div id="joystick"><div id="stick"></div></div>

<div id="shop">
<b>🛒 TIENDA</b><br>
<button onclick="upgrade('damage')">Daño +1 (20)</button>
<button onclick="upgrade('ammo')">Balas +2 (20)</button>
<button onclick="upgrade('base')">Vida +10 (20)</button>
</div>

<div id="overlay">
<h2 id="title">📖 HISTORIA</h2>
<p id="text">
El mundo cayó por un virus desconocido.<br><br>
Eres el último francotirador.<br>
Defiende el último fuerte humano.
</p>
<button onclick="startMission()">COMENZAR</button>
</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

let base=100,ammo=5,ammoMax=5,damage=1,coins=0;
let zombies=[],toSpawn=0;
let cross={x:c.width/2,y:c.height/2};
let kills=0,gameOver=false;
let mission=0;

const missions=[
 {title:"PRIMER CONTACTO",text:"El virus apareció.\nElimina 10 zombies.",goal:10},
 {title:"RESISTENCIA",text:"Las hordas crecen.\nElimina 20 zombies.",goal:20},
 {title:"EL JEFE",text:"Un mutante se acerca.\nElimínalo.",goal:1,boss:true}
];

function showOverlay(title,text){
 document.getElementById("overlay").style.display="flex";
 document.getElementById("title").textContent=title;
 document.getElementById("text").textContent=text;
}

function startMission(){
 kills=0;
 zombies=[];
 toSpawn=missions[mission].boss?1:missions[mission].goal;
 document.getElementById("goal").textContent=missions[mission].goal;
 document.getElementById("missionTxt").textContent=missions[mission].title;
 document.getElementById("overlay").style.display="none";
}

function spawnZombie(){
 let isBoss=missions[mission].boss;
 zombies.push({
  x:Math.random()*c.width,
  y:-30,
  hp:isBoss?30:2+mission,
  speed:isBoss?.3:.6
 });
}

function shoot(){
 if(ammo<=0||gameOver)return;
 ammo--;
 zombies.forEach((z,i)=>{
  if(Math.abs(z.x-cross.x)<25&&Math.abs(z.y-cross.y)<25){
   z.hp-=damage;
   if(z.hp<=0){
    kills++;
    zombies.splice(i,1);
   }
  }
 });
}

function reload(){
 setTimeout(()=>ammo=ammoMax,800);
}

function upgrade(t){
 if(coins<20)return;
 coins-=20;
 if(t==="damage")damage++;
 if(t==="ammo"){ammoMax+=2;ammo=ammoMax}
 if(t==="base"){base+=10}
}

c.addEventListener("click",shoot);

/* JOYSTICK */
const joy=document.getElementById("joystick");
const stick=document.getElementById("stick");
let jx=0,jy=0,ja=false;

joy.addEventListener("touchstart",()=>ja=true);
joy.addEventListener("touchend",()=>{
 ja=false;jx=jy=0;
 stick.style.left="35px";stick.style.top="35px";
});
joy.addEventListener("touchmove",e=>{
 if(!ja)return;
 let r=60,t=e.touches[0],b=joy.getBoundingClientRect();
 jx=Math.max(-r,Math.min(r,t.clientX-b.left-r));
 jy=Math.max(-r,Math.min(r,t.clientY-b.top-r));
 stick.style.left=jx+r-25+"px";
 stick.style.top=jy+r-25+"px";
});

function loop(){
 if(gameOver)return;
 ctx.clearRect(0,0,c.width,c.height);

 cross.x+=jx*.05;
 cross.y+=jy*.05;

 if(toSpawn>0){
  spawnZombie();
  toSpawn--;
 }

 zombies.forEach((z,i)=>{
  z.y+=z.speed;
  ctx.fillStyle=z.hp>10?"purple":"green";
  ctx.fillRect(z.x-12,z.y-12,24,24);
  if(z.y>c.height-70){
   base--;
   if(base<=0)gameOver=true;
  }
 });

 // fuerte
 ctx.fillStyle=base>40?"#777":"red";
 ctx.fillRect(c.width/2-120,c.height-60,240,40);

 // mira
 ctx.strokeStyle="red";
 ctx.beginPath();
 ctx.moveTo(cross.x-15,cross.y);
 ctx.lineTo(cross.x+15,cross.y);
 ctx.moveTo(cross.x,cross.y-15);
 ctx.lineTo(cross.x,cross.y+15);
 ctx.stroke();

 document.getElementById("kills").textContent=kills;
 document.getElementById("base").textContent=base;
 document.getElementById("ammo").textContent=ammo;

 if(kills>=missions[mission].goal){
  mission++;
  if(mission>=missions.length){
   showOverlay("🏆 VICTORIA","Has defendido a la humanidad.");
  }else{
   showOverlay(
    "MISIÓN COMPLETADA",
    missions[mission].text
   );
  }
 }

 requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
